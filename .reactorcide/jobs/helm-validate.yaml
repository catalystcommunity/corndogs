name: corndogs-helm-validate
description: "Lint and template the helm chart on PRs that touch it"
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
paths:
  include:
    - "helm_chart/chart/**"
job:
  image: alpine/helm:3.14.0
  command: |
    set -e
    # This image does not contain runnerlib. Check out the exact tested revision.
    if [ "${REACTORCIDE_WORKER_MODE:-remote}" = "local" ]; then
      cd "${REACTORCIDE_CODE_DIR:-/job/src}"
    else
      git clone --no-checkout "${REACTORCIDE_SOURCE_URL}" /job/src
      git -C /job/src fetch --depth 1 origin "${REACTORCIDE_SHA}"
      git -C /job/src checkout --detach FETCH_HEAD
      cd /job/src
    fi
    helm repo add bitnami https://charts.bitnami.com/bitnami
    helm dependency update ./helm_chart/chart
    helm lint ./helm_chart/chart
    helm template ./helm_chart/chart >/dev/null
    echo "helm chart OK"
  timeout: 600
  priority: 10
  raw_command: true
