name: corndogs-client-tests
description: "Run the generated Go + Python clients end-to-end against a live corndogs server"
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
paths:
  include:
    - "clients/**"
    - "csil/**"        # a contract change regenerates the clients
    - "corndogs/**"    # the server the clients are tested against
job:
  # Runnerbase contains runnerlib, Go, Git, and Python.
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command 'bash /job/ci/.reactorcide/jobs/scripts/client-tests.sh'"
  timeout: 900
  priority: 10
