name: corndogs-conventional-commits
description: "Validate PR commits follow conventional commits (lint only; PR-check jobs self-trigger on their own paths)"
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command 'bash /job/ci/.reactorcide/jobs/scripts/conventional-commits.sh'"
  timeout: 300
  priority: 10
  disable_run_local: true
