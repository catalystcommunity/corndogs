name: corndogs-release-helm
description: "On merge to main touching the chart: package it, publish a GitHub release, and push it to the charts repo"
triggers:
  events:
    - pull_request_merged
  branches:
    - main
paths:
  include:
    - "helm_chart/chart/**"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  # The worker prepares the source checkout. Add write credentials to its origin,
  # then run the release script from the trusted CI checkout.
  command: |
    set -e
    cd "${REACTORCIDE_CODE_DIR:-/job/src}"
    git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/${REACTORCIDE_REPO}.git"
    bash /job/ci/.reactorcide/jobs/scripts/release-helm.sh
  timeout: 1200
  priority: 15
  raw_command: true
  disable_run_local: true
environment:
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
  CHARTS_GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
  CHARTS_REPO: "catalystcommunity/charts"
