name: corndogs-test-server
description: "Build the server, run it against a user-owned postgres, run the integration tests"
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
paths:
  include:
    - "corndogs/**"
    - "csil/**"        # a contract change must still build + pass the suite
job:
  # This image inherits runnerlib from runnerbase. Runnerlib prepares the source
  # checkout before it starts the test script.
  image: containers.catalystsquad.com/public/catalystcommunity/corndogs-test-env:latest
  command: "runnerlib run --job-command 'bash /job/ci/.reactorcide/jobs/scripts/test-server.sh'"
  timeout: 1800
  priority: 10
