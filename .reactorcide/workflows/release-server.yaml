id: corndogs-release-server
name: Corndogs Server Release
description: "Release the server after a pull request changes server or CSIL files."

on:
  events:
    - pull_request_merged
  branches:
    - main

paths:
  include:
    - "corndogs/**"
    - "csil/**"

jobs:
  corndogs-release-server:
    job_file: release-server.yaml
