# Secret grants for the corndogs project (record of what is applied on the coordinator).
#
#   reactorcide secret-grants apply --file .reactorcide/secret-grants.yaml \
#     --api-url https://reactorcide.catalystsquad.com --token <admin-token>
#
# A worker may always read its own job-scoped secrets, but reading these SHARED org paths
# (catalystcommunity/ci, catalystcommunity/registry) requires a grant — without one the
# worker DENIES the read and the job fails at secret resolution (exit 1, no job logs). This
# is exactly why corndogs-release-server failed after the reactorcide migration: the project
# record + VCS token were wired, but these job secret grants were never created. Job names
# are the bare job `name:` fields (the coordinator scopes the match by project).
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: corndogs-release-server-registry
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: corndogs-release-server
          match: exact
      description: "release-server: build + push the corndogs image"

  - metadata:
      name: corndogs-release-server-ci
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: corndogs-release-server
          match: exact
      description: "release-server: githubpat for semver-tag + chart appVersion bump"

  - metadata:
      name: corndogs-build-test-env-registry
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: corndogs-build-test-env
          match: exact
      description: "build-test-env: push the corndogs test-env image"

  - metadata:
      name: corndogs-release-helm-ci
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: corndogs-release-helm
          match: exact
      description: "release-helm: githubpat for chart release"
