# Secret grants for the corndogs project (record of what is applied on the coordinator).
#
#   reactorcide secret-grants apply --file .reactorcide/secret-grants.yaml \
#     --api-url https://reactorcide.catalystsquad.com --token <admin-token>
#
# A worker can read its job-scoped secrets. Shared organization paths require a grant.
# Without a grant, secret resolution fails before the job starts.
# Each subject jobName value must match a workflow node name.
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: corndogs-release-server-registry
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: corndogs-release-server
          match: exact
      description: "release-server: build + push the corndogs image"

  - metadata:
      name: corndogs-release-server-ci
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: corndogs-release-server
          match: exact
      description: "release-server: githubpat for semver-tag + chart appVersion bump"

  - metadata:
      name: corndogs-release-helm-ci
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: corndogs-release-helm
          match: exact
      description: "release-helm: githubpat for chart release"
  - metadata:
      name: corndogs-release-helm-ci-chart-repo
    spec:
      scope:
        project: github.com/catalystcommunity/corndogs
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: corndogs-release-helm
          match: exact
      description: "release-helm: githubpat for pushing to the charts repo"
